import groovy.json.JsonSlurper

plugins {
    id 'java'
}

def pluginConfig = new JsonSlurper().parse(file('plugin.json'))
group = pluginConfig.group
version = pluginConfig.version

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${pluginConfig.paperVersion}"
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(pluginConfig.javaVersion)
    targetCompatibility = JavaVersion.toVersion(pluginConfig.javaVersion)
}

tasks.processResources {
    def values = [pluginName: pluginConfig.pluginName, version: project.version,
                  apiVersion: pluginConfig.apiVersion]
    inputs.properties(values)
    filesMatching('plugin.yml') { expand(values) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 对真实故障路径做回归；编译期服务器 API 也供测试使用。
configurations.testImplementation.extendsFrom(configurations.compileOnly)
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.1'
}
tasks.test { useJUnitPlatform() }

jar { archiveBaseName = pluginConfig.pluginName }
